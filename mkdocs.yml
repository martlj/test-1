# Documentation site settings. Keep this file minimal: Material for MkDocs
# reaches end of life in 2027, and its successor (Zensical) reads this file,
# so the fewer custom settings, the easier the move.
site_name: mito-seg
site_description: Fiji scripts for segmenting mitochondria in FIB-SEM volumes.
site_url: https://martlj.github.io/test-1/
repo_url: https://github.com/martlj/test-1
repo_name: martlj/test-1

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Usage: usage.md
  - Decisions: decisions.md
  - Development: development.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  # Reuses README sections (between --8<-- markers) so they're written once.
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
