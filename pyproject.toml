[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# No Python package: the project is Fiji scripts. Python is only used
# for the tests and tools, so build an empty package pip can install.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[project]
name = "mito-seg"
# The version changes only in a release commit; see CONTRIBUTING.md.
# 0.0.0 means nothing has been released yet.
version = "0.0.0"
description = "Fiji scripts for segmenting mitochondria in FIB-SEM volumes."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Martin Jones", email = "martin.jones@crick.ac.uk" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "numpy", "tifffile"]
docs = ["mkdocs-material"]
notebooks = ["jupyterlab", "matplotlib"]
dev = ["mito-seg[test,docs,notebooks]", "pre-commit", "ruff", "tox"]

[project.urls]
Source = "https://github.com/martlj/test-1"
Issues = "https://github.com/martlj/test-1/issues"
Changelog = "https://github.com/martlj/test-1/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
    "gpu: needs a CUDA-capable GPU; skipped automatically when none is available",
    "fiji: runs a Fiji script headless; skipped unless FIJI is set to the Fiji launcher",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, pyupgrade, bugbear, numpy-specific rules
select = ["F", "E", "W", "I", "UP", "B", "NPY"]
